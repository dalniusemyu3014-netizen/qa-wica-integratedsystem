<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA System - WICA Pontianak</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-blue-900 mb-6 border-b-2 pb-2">QA Control Form</h1>
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Jenis Produk</label>
                <select class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    <option>RBDPOL</option>
                    <option>CPKO</option>
                    <option>Stearin</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Parameter Fisik (Warna/Bau)</label>
                <input type="text" placeholder="Masukkan hasil cek" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Status</label>
                <div class="flex gap-4 mt-2">
                    <label class="inline-flex items-center"><input type="radio" name="status" class="text-blue-600"> <span class="ml-2">OK</span></label>
                    <label class="inline-flex items-center"><input type="radio" name="status" class="text-red-600"> <span class="ml-2">NOT OK</span></label>
                </div>
            </div>
            <button type="button" class="w-full bg-blue-800 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700">
                SIMPAN DATA
            </button>
        </form>
    </div>
</body>
</html>
