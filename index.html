<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Control - WICA Pontianak</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-blue-800 border-b-2 pb-2">QA Control Form</h2>
        
        <form id="qaForm" class="space-y-4">
            <div>
                <label class="block font-semibold">Nama Pemeriksa</label>
                <input type="text" name="inspector" class="w-full border p-2 rounded" required>
            </div>

            <div>
                <label class="block font-semibold">Parameter Fisik (RBDPOL/CPKO)</label>
                <select name="parameter" class="w-full border p-2 rounded">
                    <option>Warna Sesuai Standar</option>
                    <option>Bau Normal</option>
                    <option>Kandungan Kotoran (Dirt Content)</option>
                </select>
            </div>

            <div>
                <label class="block font-semibold">Status Check</label>
                <div class="flex gap-4 mt-1">
                    <label><input type="radio" name="status" value="OK" checked> OK</label>
                    <label><input type="radio" name="status" value="NOT OK"> NOT OK</label>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 font-bold">
                KIRIM LAPORAN
            </button>
        </form>
    </div>
</body>
</html>
